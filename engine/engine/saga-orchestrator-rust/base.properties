# ============================
# Configuração compartilhada do motor -- vale para QUALQUER domínio que rode neste
# processo. Não coloque event.in/command.out/route/saga.* aqui: isso é específico de
# cada domínio e vive em domains/<nome>/orchestrator.<nome>.properties.
#
# Para rodar um domínio, combine este arquivo com o dele (veja scripts/run-domain.sh
# na raiz do repositório, ou o README do domínio específico).
# ============================

kafka.bootstrap.servers=localhost:9092
kafka.group.id=saga-orchestrator
kafka.auto.offset.reset=earliest
kafka.enable.auto.commit=true
# NOTA: esta chave é apenas informativa. O orchestrator sempre comita o offset
# manualmente, só depois de processar a mensagem com sucesso (at-least-once).

kafka.dlq.topic=_orchestrator.dlq
kafka.retry.topic=_orchestrator.retry
kafka.state.topic=_orchestrator.state

# ============================
# Convenções globais
# ============================
event.type.source=payload
event.type.path=$.type

correlation.source=payload
correlation.path=$.correlationId

saga.step.timeout.ms=30000

# ============================
# Política de erro (padrão -- descomente para ativar)
# ============================
#error.on.parse=DLQ
#error.on.missing.correlation=DLQ
#error.on.missing.event.type=DLQ
#error.on.unknown.event=IGNORE
#error.on.publish.fail=RETRY
