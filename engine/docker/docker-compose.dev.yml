version: "3.8"
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  # Usado pelo domínio nfe (nfe-generator) -- documento por NF-e com histórico de
  # transições embutido. Cashback não depende disso (usa H2/Redis).
  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mongo-data:/data/db

  # ============================
  # Observabilidade: Loki (armazena/indexa) + Promtail (coleta) + Grafana (visualiza).
  # Self-hosted e grátis, mesmo padrão do resto deste compose. Os apps (orquestrador Rust,
  # serviços Java) escrevem log estruturado (JSON) em stdout -- ao rodar localmente via
  # cargo run/mvn spring-boot:run, redirecione a saída pra ./logs/<nome>.log (convenção de
  # nome documentada em docs/observability/README.md) pra o Promtail pegar via bind-mount.
  #
  # Pra trocar por Datadog em vez de Grafana: como o formato de log já é JSON neutro,
  # só o COLETOR muda (troca o container do promtail pelo Datadog Agent apontando pra essa
  # mesma pasta ./logs) -- nenhuma mudança de código de aplicação é necessária. Veja
  # docs/observability/README.md.
  # ============================
  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../logs:/var/log/app:ro
    command: -config.file=/etc/promtail/config.yml

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    depends_on:
      loki:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana-provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  redis-data:
  mongo-data:
  loki-data:
  grafana-data:

# Infra única compartilhada por todos os domínios (cashback, nfe, o que vier depois).
# Cada domínio só declara SEUS PRÓPRIOS tópicos (veja domains/<nome>/topics.txt e
# scripts/create-topics.sh na raiz) -- não precisa de um Kafka/Redis por domínio.
#
# create-topics.sh faz "docker exec -i kafka" -- com o healthcheck acima, dá pra
# encadear "docker compose up -d --wait && ./scripts/create-topics.sh ..." sem
# apanhar do Kafka ainda não estar pronto pra aceitar comandos administrativos.
