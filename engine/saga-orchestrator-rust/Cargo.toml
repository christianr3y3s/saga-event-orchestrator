[package]
name = "saga-orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
# "json" habilita saída estruturada (tracing_subscriber::fmt().json()) -- necessário
# pra exportar pra Loki/Datadog sem depender de regex sobre texto solto.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

tokio = { version = "1", features = ["full"] }

# Kafka client (wraps librdkafka)
rdkafka = { version = "0.36", features = ["tokio", "cmake-build"] }
