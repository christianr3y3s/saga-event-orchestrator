# ============================
# Domínio: Loja
# Só o que é específico deste domínio -- sem kafka.bootstrap.servers nem convenções
# globais (isso vive em engine/saga-orchestrator-rust/base.properties). Combine os dois
# antes de rodar (veja scripts/run-domain.sh na raiz do repo).
# ============================

# Rotula todo log emitido por este processo (veja docs/observability/README.md) --
# necessário porque scripts/run-domain.sh combina este arquivo com base.properties num
# arquivo temporário cujo nome não identifica o domínio.
domain.name=loja

event.in.PedidoCriado.topic=loja.pedido.criado
event.in.EstoqueReservado.topic=loja.estoque.reservado
event.in.EstoqueIndisponivel.topic=loja.estoque.indisponivel
event.in.PagamentoAprovado.topic=loja.pagamento.aprovado
event.in.PagamentoRecusado.topic=loja.pagamento.recusado
event.in.EstoqueLiberado.topic=loja.estoque.liberado

command.out.ReservarEstoque.topic=loja.estoque.reservar
command.out.ProcessarPagamento.topic=loja.pagamento.processar
command.out.LiberarEstoque.topic=loja.estoque.liberar
command.out.ExpedirPedido.topic=loja.pedido.expedir
command.out.SagaCompleted.topic=saga.completed
command.out.SagaFailed.topic=saga.failed

route.PedidoCriado.emit=ReservarEstoque
route.EstoqueReservado.emit=ProcessarPagamento
route.EstoqueIndisponivel.emit=SagaFailed
route.PagamentoAprovado.emit=ExpedirPedido,SagaCompleted
route.PagamentoRecusado.emit=LiberarEstoque
route.EstoqueLiberado.emit=SagaFailed

# ============================
# FSM declarativa da LojaSaga (validada no bootstrap -- veja
# engine/saga-orchestrator-rust/src/fsm.rs)
#
# WAIT_PEDIDO -> ReservandoEstoque -> AguardandoPagamento -> Completed
#                       |                      |
#                       v                      v
#                    Failed <-- Compensando <--+
#
# Ao contrário do gap documentado (de propósito) em orchestrator.cashback.properties,
# aqui o caminho de falha tem saída completa: PagamentoRecusado leva a Compensando, que
# tem uma transição de saída (EstoqueLiberado -> Failed) -- sem isso o validador da FSM
# recusaria o boot com um estado sem saída.
# ============================
saga.LojaSaga.start=WAIT_PEDIDO
saga.LojaSaga.end=Completed,Failed
saga.LojaSaga.states=WAIT_PEDIDO,ReservandoEstoque,AguardandoPagamento,Compensando,Completed,Failed

saga.LojaSaga.state.WAIT_PEDIDO.on.PedidoCriado=ReservandoEstoque
saga.LojaSaga.state.ReservandoEstoque.on.EstoqueReservado=AguardandoPagamento
saga.LojaSaga.state.ReservandoEstoque.on.EstoqueIndisponivel=Failed
saga.LojaSaga.state.AguardandoPagamento.on.PagamentoAprovado=Completed
saga.LojaSaga.state.AguardandoPagamento.on.PagamentoRecusado=Compensando
saga.LojaSaga.state.Compensando.on.EstoqueLiberado=Failed
