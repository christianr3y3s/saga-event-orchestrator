# ============================
# Domínio: Cashback
# Só o que é específico deste domínio -- sem kafka.bootstrap.servers nem convenções
# globais (isso vive em engine/saga-orchestrator-rust/base.properties). Combine os dois
# antes de rodar (veja scripts/run-domain.sh na raiz do repo).
# ============================

event.in.TransactionValidated.topic=transactions.validated
event.in.CashbackApplied.topic=cashback.applied

command.out.CalculateCashback.topic=cashback.calculate
command.out.SagaCompleted.topic=saga.completed
command.out.SagaFailed.topic=saga.failed

route.TransactionValidated.emit=CalculateCashback
route.CashbackApplied.emit=SagaCompleted

# ============================
# FSM declarativa da CashbackSaga (validada no bootstrap -- veja
# engine/saga-orchestrator-rust/src/fsm.rs)
# ============================
saga.CashbackSaga.start=WAIT_TRANSACTION
saga.CashbackSaga.end=Completed
saga.CashbackSaga.states=WAIT_TRANSACTION,InProgress,Completed
saga.CashbackSaga.state.WAIT_TRANSACTION.on.TransactionValidated=InProgress
saga.CashbackSaga.state.InProgress.on.CashbackApplied=Completed

# Documentação do gap real: hoje não existe nenhum evento de falha no fluxo de cashback
# (nenhum serviço emite "CashbackFailed"), então não há Compensating aqui ainda -- e por
# isso a FSM acima passa limpa. Se um dia isso for adicionado sem uma transição de saída,
# fica assim (descomente pra ver o validador recusar o boot de propósito):
#
# saga.CashbackSaga.end=Completed,Failed
# saga.CashbackSaga.states=WAIT_TRANSACTION,InProgress,Compensating,Completed,Failed
# saga.CashbackSaga.state.InProgress.on.CashbackFailed=Compensating
# # <- falta aqui: saga.CashbackSaga.state.Compensating.on.<algumEvento>=Failed
