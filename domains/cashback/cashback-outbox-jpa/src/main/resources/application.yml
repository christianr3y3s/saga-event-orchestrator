server:
  port: 8083

spring:
  application:
    name: cashback-outbox-jpa

  # H2 em memória para o primeiro round de testes -- ao trocar para Postgres/MySQL de
  # verdade, só isto muda (url/driver/username/password), nada no código.
  datasource:
    url: jdbc:h2:mem:cashback;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update   # ok para H2/protótipo; numa migração real, trocar por Flyway/Liquibase
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true       # http://localhost:8083/h2-console -- só para inspecionar em dev

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  kafka:
    out-topic: cashback.applied
  outbox:
    publish-fixed-delay-ms: 5000
    batch-size: 50
