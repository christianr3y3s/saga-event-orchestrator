server:
  # 8083 já é usado por cashback-outbox-jpa; 8085 evita colisão se os dois rodarem juntos
  # (ver domains/logistica/logistica-importacao-service para o próximo, 8086).
  port: 8085

spring:
  application:
    name: logistica-rota-service

# ============================
# Motor de otimização de rota (domains/logistica/DESIGN.md, camada 1-3). Serviço
# síncrono, sem Kafka/saga -- não tem orchestrator.logistica.properties nem topics.txt
# de propósito (ver README deste domínio).
# ============================
app:
  rota:
    # Qual ProvedorDistancias o Spring injeta em SimuladorRota (DIP -- trocar é só isto,
    # nenhum código muda): "haversine" (default, linha reta -- rápido, sem chave, mas não é
    # rota real) ou "openrouteservice" (distância rodoviária real, perfil driving-hgv;
    # exige app.rota.ors.api-key). Sobrescrevível por APP_ROTA_DISTANCIA_PROVIDER sem
    # redeploy -- é a variável a trocar antes de qualquer demonstração para o mercado.
    distancia-provider: haversine

    # Fator de "sinuosidade" aplicado à distância em linha reta (HaversineProvedorDistancias,
    # usado só quando distancia-provider=haversine). 1.0 = linha reta pura.
    fator-rodoviario: 1.3

    # Teto de pontos por /rotas/simular (matriz NxN + 2-opt). 50 = limite da Matrix API grátis da ORS.
    max-pontos: 50

    ors:
      # Chave da OpenRouteService (grátis em openrouteservice.org/dev/#/signup, ~2000
      # requisições/dia no plano free). Deixe em branco se distancia-provider=haversine.
      # Sobrescreva por APP_ROTA_ORS_API_KEY -- nunca coloque a chave real neste arquivo.
      api-key: ""
      base-url: https://api.openrouteservice.org
      # Sem timeout uma ORS travada seguraria a thread da requisição indefinidamente.
      connect-timeout-ms: 3000
      read-timeout-ms: 10000
      # driving-hgv = caminhão pesado (heavy goods vehicle); evita vias com restrição de
      # altura/peso quando a ORS tiver esse dado para a via. Ver DESIGN.md.
      perfil: driving-hgv
  cors:
    # Origens autorizadas a chamar /rotas/** e /fretes/** de fora (a interface web, hospedada
    # em outro domínio). "*" é só para o primeiro teste de aceitação -- troque pelo domínio
    # real antes de produção (pode ser sobrescrito por APP_CORS_ALLOWED_ORIGINS, sem redeploy).
    allowed-origins: "*"

# Health check para o orquestrador de deploy (só health/info expostos; nada de env/beans).
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
