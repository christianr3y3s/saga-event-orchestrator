server:
  # 8083 já é usado por cashback-outbox-jpa; 8085 evita colisão se os dois rodarem juntos
  # (ver domains/logistica/logistica-importacao-service para o próximo, 8086).
  port: 8085

spring:
  application:
    name: logistica-rota-service

# ============================
# Motor de otimização de rota (domains/logistica/DESIGN.md, camada 1-3). Serviço
# síncrono, sem Kafka/saga -- não tem orchestrator.logistica.properties nem topics.txt
# de propósito (ver README deste domínio).
# ============================
app:
  rota:
    # Fator de "sinuosidade" aplicado à distância em linha reta (HaversineProvedorDistancias).
    # 1.0 = linha reta pura. Referência grosseira até trocar por OpenRouteService/GraphHopper
    # com perfil de veículo pesado (ver comparação em DESIGN.md).
    fator-rodoviario: 1.3
  cors:
    # Origens autorizadas a chamar /rotas/** e /fretes/** de fora (a interface web, hospedada
    # em outro domínio). "*" é só para o primeiro teste de aceitação -- troque pelo domínio
    # real antes de produção (pode ser sobrescrito por APP_CORS_ALLOWED_ORIGINS, sem redeploy).
    allowed-origins: "*"
